name: openorchestrator

services:
  db:
    image: postgres:17-alpine
    container_name: openorchestrator-db
    environment:
      POSTGRES_DB: openorchestrator
      POSTGRES_USER: openorchestrator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openorchestrator}
    volumes:
      - openorchestrator-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Backend menunggu sampai basis datanya SIAP MENERIMA, bukan sekadar
      # sampai containernya hidup. Tanpa ini, Flyway berjalan lebih dulu dan
      # gagal pada percobaan pertama setiap kali docker compose up dijalankan.
      test: ["CMD-SHELL", "pg_isready -U openorchestrator -d openorchestrator"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: openorchestrator-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/openorchestrator
      DB_USER: openorchestrator
      DB_PASSWORD: ${DB_PASSWORD:-openorchestrator}
      JWT_SECRET: ${JWT_SECRET:-ganti-nilai-ini-dengan-rahasia-minimal-32-karakter}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENORCHESTRATOR_SIGNING_KEY: /data/signing.key
      OPENORCHESTRATOR_TZ: ${OPENORCHESTRATOR_TZ:-Asia/Jakarta}
    volumes:
      # signing.key MILIK OpenOrchestrator .NET, dipasang apa adanya dan hanya-baca.
      #
      # Ini bagian yang mudah terlewat dan akibatnya sunyi: kredensial di
      # basis data disandikan dengan kunci ini. Container yang membuat kunci
      # sendiri tetap menyala dengan gembira, lalu setiap kredensial terbaca
      # sebagai kosong — dan yang terlihat cuma "login gagal" di aplikasi yang
      # diotomasi robot, jauh dari sini.
      - ${OPENORCHESTRATOR_DATA:-${LOCALAPPDATA}/JakForge/ForgeHub}/signing.key:/data/signing.key:ro
    ports:
      - "8080:8080"
    healthcheck:
      # Memeriksa ISI jawabannya, bukan sekadar bahwa ada jawaban. Actuator
      # tetap membalas 200 dengan status DOWN pada beberapa keadaan, dan
      # container yang lulus pemeriksaan justru saat basis datanya putus
      # adalah pemeriksaan yang menyesatkan.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: openorchestrator-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # -------------------------------------------------------------------
  # Pemindah data, sekali jalan.
  #
  # TIDAK ikut "docker compose up" biasa — hanya lewat profil:
  #
  #     docker compose --profile pindah run --rm pindah
  #
  # Alasannya: memasukkan data yang sama dua kali bukan sekadar mubazir.
  # Tabel yang tidak punya batasan UNIQUE (jobs, logs, queue_items) akan
  # benar-benar bertambah ganda, dan tidak ada cara membedakan mana salinan
  # kedua sesudahnya.
  #
  # Menunggu backend SEHAT, bukan sekadar hidup: berkas SQL-nya menyisipkan
  # ke tabel yang baru dibuat Flyway, dan Flyway berjalan saat backend naik.
  # -------------------------------------------------------------------
  pindah:
    image: postgres:17-alpine
    container_name: openorchestrator-pindah
    profiles: ["pindah"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-openorchestrator}
    volumes:
      - ${OPENORCHESTRATOR_DATA:-${LOCALAPPDATA}/JakForge/ForgeHub}:/pindahan:ro
    # ON_ERROR_STOP: tanpa ini psql melanjutkan sesudah pernyataan yang gagal
    # dan keluar dengan kode 0, jadi pindahan yang separuh gagal terlihat
    # persis seperti yang berhasil.
    command: >
      psql -h db -U openorchestrator -d openorchestrator
           -v ON_ERROR_STOP=1
           -f /pindahan/openorchestrator-migrasi.sql

volumes:
  openorchestrator-data:

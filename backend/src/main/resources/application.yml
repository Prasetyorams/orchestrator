server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: openorchestrator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openorchestrator}
    username: ${DB_USER:openorchestrator}
    password: ${DB_PASSWORD:openorchestrator}
    hikari:
      maximum-pool-size: 12

  # Skema dikelola Flyway, bukan ORM: lapisan datanya JdbcTemplate dan tidak
  # ada satu pun @Entity. Bentuk basis data ditentukan berkas migrasi yang bisa
  # ditinjau, bukan oleh versi kode yang kebetulan jalan terakhir.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Seluruh setelan OpenOrchestrator, dibaca ke satu record bertipe: OpenOrchestratorProperties.
# Nilai yang dulu tertulis di dalam kode ada di sini, supaya bisa diubah lewat
# variabel lingkungan tanpa membangun ulang — mis. OPENORCHESTRATOR_ROBOT_HEARTBEATTIMEOUT=60s.
openorchestrator:
  # Zona untuk menghitung batas "hari ini" di dasbor.
  #
  # BUKAN zona server. Di dalam container zona server adalah UTC, dan orang
  # yang membuka dasbor pukul 7 pagi WIB akan melihat angka "hari ini" yang
  # masih menghitung kemarin sore. Nilainya nama IANA, mis. Asia/Jakarta.
  display-timezone: ${OPENORCHESTRATOR_TZ:UTC}

  secret:
    # Kunci induk untuk menyandikan kredensial. Bukan sekadar berkas rahasia
    # biasa: kredensial yang sudah ada di forgehub.db disandikan dengan kunci
    # INI, jadi memindahkan data tanpa memindahkan berkasnya membuat seluruh
    # kredensial lama tidak bisa dibuka lagi — diam-diam, sebagai nilai kosong.
    #
    # Di Docker berkasnya dipasang sebagai volume dari
    # %LOCALAPPDATA%\JakForge\ForgeHub\signing.key, bukan dibuat baru.
    key-file: ${OPENORCHESTRATOR_SIGNING_KEY:/data/signing.key}

  jwt:
    # WAJIB diganti di produksi. Minimal 32 karakter untuk HS256.
    secret: ${JWT_SECRET:ganti-nilai-ini-dengan-rahasia-minimal-32-karakter}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    # Berapa lama peramban boleh mengingat jawaban preflight.
    max-age: 1h

  robot:
    # Setelah berapa lama tanpa denyut sebuah robot dianggap terputus.
    # Pekerjaan yang robotnya diam dua kali selama ini ditandai gagal.
    heartbeat-timeout: 45s

  permission-cache:
    # Izin peran diingat selama ini per orang, supaya denyut robot tiap
    # beberapa detik tidak menjadi kueri tiap beberapa detik. Perubahan peran
    # lewat OpenOrchestrator menghapus ingatannya seketika.
    ttl: 10s

  scheduler:
    # Jeda sebelum putaran pertama: Flyway dan basis data selesai lebih dulu.
    initial-delay: 15s
    # Selang pemeriksaan pemicu dan pekerjaan terputus.
    interval: 30s

  limits:
    # Isi paket dan berkas dikirim sebagai base64 DI DALAM JSON: 64 MB menjadi
    # sekitar 85 MB teks yang harus muat di memori sekaligus.
    max-package-size: 64MB
    max-bucket-file-size: 32MB

  bootstrap:
    # Isi awal yang ditanam saat aplikasi naik, hanya kalau belum ada.
    tenant-name: default
    admin-username: OO_Admin
    admin-password: openorchestrator
    admin-display-name: OpenOrchestrator Administrator
    # Nama mesin tempat OpenOrchestrator berjalan; kosong berarti nama host.
    machine-name: ${OPENORCHESTRATOR_MACHINE_NAME:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    id.jakforge.openorchestrator: INFO

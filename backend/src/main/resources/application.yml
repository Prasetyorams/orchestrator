server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: forgehub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forgehub}
    username: ${DB_USER:forgehub}
    password: ${DB_PASSWORD:forgehub}
    hikari:
      maximum-pool-size: 12

  jpa:
    hibernate:
      # Skema dikelola Flyway, BUKAN Hibernate. Membiarkan Hibernate
      # mengubah skema berarti bentuk basis data bergantung pada versi
      # kode yang kebetulan jalan terakhir — dan itu tidak bisa ditinjau
      # sebelum dijalankan.
      #
      # "none", bukan "validate": lapisan datanya memakai JdbcTemplate dan
      # tidak ada satu pun @Entity yang tersisa. Membiarkan "validate" pada
      # pemetaan kosong tidak salah, tapi menyalakan pemeriksa untuk sesuatu
      # yang tidak diperiksa hanya menambah satu tahap yang bisa gagal.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

forgehub:
  secret:
    # Kunci induk untuk menyandikan kredensial. Bukan sekadar berkas rahasia
    # biasa: kredensial yang sudah ada di forgehub.db disandikan dengan kunci
    # INI, jadi memindahkan data tanpa memindahkan berkasnya membuat seluruh
    # kredensial lama tidak bisa dibuka lagi — diam-diam, sebagai nilai kosong.
    #
    # Di Docker berkasnya dipasang sebagai volume dari
    # %LOCALAPPDATA%\JakForge\ForgeHub\signing.key, bukan dibuat baru.
    key-file: ${FORGEHUB_SIGNING_KEY:/data/signing.key}

  jwt:
    # WAJIB diganti di produksi. Minimal 32 karakter untuk HS256.
    secret: ${JWT_SECRET:ganti-nilai-ini-dengan-rahasia-minimal-32-karakter}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    id.jakforge.forgehub: INFO
